name: VIMEK build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            architecture: x64
            bits: '64'
          - platform: x86
            architecture: Win32
            bits: '32'
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci -A ${{ matrix.architecture }}
      - name: Build
        run: cmake --build build/ci --config Release
      - name: Test input and native Windows dialogs
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Package Windows
        shell: pwsh
        run: |
          $vimekVersion = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          New-Item -ItemType Directory -Force dist/${{ matrix.platform }} | Out-Null
          Copy-Item build/ci/Release/VIMEK.exe dist/${{ matrix.platform }}/VIMEK${{ matrix.bits }}.exe
          Copy-Item LICENSE,NOTICE.md dist/${{ matrix.platform }}/
          ./scripts/package-windows.ps1 -Platform ${{ matrix.platform }} -Version $vimekVersion
      - uses: actions/upload-artifact@v4
        with:
          name: VIMEK-Windows-${{ matrix.platform }}
          path: dist/VIMEK-*-Windows-${{ matrix.platform }}.zip
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and test engine
        run: bash scripts/build-macos.sh
      - name: Package macOS
        run: |
          vimek_version=0.1.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then vimek_version="${GITHUB_REF_NAME#v}"; fi
          mv dist/macos/VIMEK-macOS.zip "dist/macos/VIMEK-$vimek_version-macOS-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: VIMEK-macOS
          path: dist/macos/VIMEK-*-macOS-universal.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: VIMEK-*
          path: dist/release
          merge-multiple: true
      - name: Archive source and calculate checksums
        run: |
          vimek_version="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="VIMEK-$vimek_version/" HEAD > "dist/release/VIMEK-$vimek_version-source.zip"
          cd dist/release
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vimek_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then vimek_flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --verify-tag --title "VIMEK ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md "${vimek_flags[@]}"
